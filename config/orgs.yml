# Target organisations for the typo crawl.
#
# `defaults` apply to every org; each org entry may override any of them.
# Run `typocrawler orgs` to see the resolved list.

defaults:
  min_stars: 0            # skip repos with fewer stars than this
  include_forks: false
  include_archived: false
  extra_paths: []         # additional markdown files to scan later, e.g. ["CONTRIBUTING.md"]

orgs:
  # big tech
  - login: google
  - login: microsoft
  - login: facebook       # Meta
  - login: aws            # Amazon Web Services
  - login: kubernetes
  - login: netflix
  - login: apple

  # mid-size tech — min_stars keeps the volume sane; drop it to scan everything
  - login: stripe
    min_stars: 10
  - login: shopify
    min_stars: 25
  - login: cloudflare
    min_stars: 15
  - login: hashicorp
    min_stars: 15
  - login: elastic
    min_stars: 20
  - login: vercel
    min_stars: 20
  - login: supabase
    min_stars: 15
  - login: grafana
    min_stars: 20
  - login: getsentry     # Sentry
    min_stars: 15
  - login: mongodb
    min_stars: 20
  - login: gitlabhq      # GitLab
    min_stars: 20
  - login: DataDog
    min_stars: 15
  - login: uber
  - login: twitter
  - login: linkedin
  - login: airbnb
  - login: adobe
  - login: salesforce
  - login: spotify
  - login: openai
  - login: anthropics
  - login: huggingface
  - login: ibm
  - login: RedHatOfficial
  - login: oracle
