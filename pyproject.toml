[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typocrawler"
version = "0.1.0"
description = "Crawl big-org open-source READMEs and surface genuine typos."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "manavkr0710" }]
dependencies = [
    "typer>=0.12",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "tenacity>=8.5",
    "python-dotenv>=1.0",
    "markdown-it-py>=3.0",
    "codespell>=2.3",
    "typos>=1.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "respx>=0.21",
]

[project.scripts]
typocrawler = "typocrawler.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/typocrawler"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
