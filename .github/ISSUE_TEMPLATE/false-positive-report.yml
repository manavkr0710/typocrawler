name: Report an inaccurate typo
description: Flag a finding on the dashboard that isn't actually a typo. It'll be reviewed and added to the allowlist if confirmed.
title: "False positive: "
labels: ["false-positive"]
body:
  - type: input
    id: repo
    attributes:
      label: Repository
      placeholder: facebook/react
    validations:
      required: true
  - type: input
    id: word
    attributes:
      label: Flagged word
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Context / line
  - type: textarea
    id: why
    attributes:
      label: Why is this not a typo?
      placeholder: "e.g. it's a product name, a code identifier, correct in another dialect of English..."
    validations:
      required: true
