name: Crawl and publish

on:
  schedule:
    - cron: "11 7 * * *" # nightly, off the hour to dodge the GitHub Actions rush
  workflow_dispatch:
    inputs:
      fetch_limit:
        description: "Max README fetches this run (0 = all remaining)"
        default: "3000"

permissions:
  contents: write # manage the data-snapshot release (typos.db)
  pages: write # deploy the dashboard
  id-token: write # required by actions/deploy-pages

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install typocrawler
        run: pip install -e .

      - name: Restore typos.db from the data release
        run: |
          if gh release download data-snapshot --pattern 'typos.db' --clobber 2>/dev/null; then
            echo "restored existing typos.db ($(du -h typos.db | cut -f1))"
          else
            echo "no existing typos.db release asset, starting fresh"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply migrations (also bootstraps a fresh db)
        run: alembic upgrade head

      - name: Discover repos
        run: typocrawler discover
        env:
          GITHUB_TOKEN: ${{ secrets.CRAWLER_GH_TOKEN }}

      - name: Fetch READMEs
        run: typocrawler fetch --limit "${{ github.event.inputs.fetch_limit || '3000' }}"
        env:
          GITHUB_TOKEN: ${{ secrets.CRAWLER_GH_TOKEN }}

      - name: Spell-check + heuristics
        run: typocrawler check

      - name: LLM verification
        run: typocrawler verify --provider gemini --batch 100
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        continue-on-error: true # a quota/rate-limit day shouldn't fail the whole run

      - name: Build the dashboard
        run: typocrawler report --out site

      - name: Save typos.db to the data release
        run: |
          if gh release view data-snapshot >/dev/null 2>&1; then
            gh release upload data-snapshot typos.db --clobber
          else
            gh release create data-snapshot typos.db \
              --title "typos.db snapshot" \
              --notes "Working database for the nightly crawl. Not a software release, just persistent storage between CI runs; replaced every run."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true # a hiccup here shouldn't block publishing this run's dashboard

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
